{% load static tailwind_tags %}
{% comment %} {% load static %} {% endcomment %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- make it mobile friendly -->
    <meta http-equiv="X-UA-Compatible" content="ie=edge"> <!-- just for Internet Explorer or Edge -->

    <title>{% block title %} {% endblock %} My Blog</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet" integrity="sha384-dyB0KpDQhf9UpJDO6rvl7GT3H3KY8Je1luqJoC4Q6GIo4BRQgjp2FXjkKsnqXf69" crossorigin="anonymous">

    {% tailwind_css %}
</head>
<body class="con text-gray-900">

    <!-- START NAV -->
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between py-4">
                <!-- Logo -->
                <a class="text-xl font-bold text-gray-800" href="/">
                    {% comment %} <img src="{% static 'core/img/logo.png' %}" alt="myLogo"> {% endcomment %}
                    <strong>SRV</strong>
                </a>

                <!-- Navbar Burger -->
                <button class="navbar-burger text-gray-600 focus:outline-none lg:hidden" data-target="navbarMenu">
                    <i class="fas fa-bars text-lg"></i>
                </button>

                <!-- Navbar Links -->
                <div id="navbarMenu" class="hidden lg:flex lg:items-center space-x-6">
                    <form method="get" action="{% url 'search' %}" class="relative">
                        <input 
                            class="rounded-full border border-gray-300 py-2 pl-10 pr-4 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                            name="query"
                            type="text"
                            placeholder="Search">
                        <span class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400">
                            <i class="fa fa-search"></i>
                        </span>
                    </form>
                    <a href="/" class="text-gray-700 font-semibold hover:text-blue-500">
                        Home
                    </a>
                    <a href="{% url 'about' %}" class="text-gray-700 font-semibold hover:text-blue-500">
                        About
                    </a>
                </div>
            </div>
        </div>
    </nav>
    <!-- END NAV -->

    <section class="py-8">
        <div class="container mx-auto px-4">
            {% block content %}
            {% endblock %}
        </div>
    </section>

    <!-- START FOOTER -->
    <footer class="bg-gray-800 py-6">
        <div class="container mx-auto text-center text-gray-400">
            <p>Copyright &copy; 2023 - SRV Blog</p>
        </div>
    </footer>
    <!-- END FOOTER -->

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const navbarBurger = document.querySelector('.navbar-burger');
            const navbarMenu = document.getElementById('navbarMenu');

            if (navbarBurger && navbarMenu) {
                navbarBurger.addEventListener('click', function () {
                    navbarMenu.classList.toggle('hidden');
                });
            }
        });
    </script>
</body>
</html>
